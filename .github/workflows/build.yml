name: Build All

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Linux binary
        run: |
          pyinstaller --onefile --windowed --name "KolocPlayer" v0.3.0_gui.py
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: KolocPlayer-Linux
          path: dist/KolocPlayer

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "KolocPlayer" v0.3.0_gui.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KolocPlayer-Windows
          path: dist/KolocPlayer.exe
