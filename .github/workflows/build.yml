name: Build and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name "KolocPlayer_linux" v0.3.0_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: KolocPlayer_linux
          path: dist/KolocPlayer_linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name "KolocPlayer_windows" v0.3.0_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: KolocPlayer_windows.exe
          path: dist/KolocPlayer_windows.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KolocPlayer_linux
      - uses: actions/download-artifact@v4
        with:
          name: KolocPlayer_windows.exe
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.3.0
          name: "KolocPlayer v0.3.0"
          files: |
            KolocPlayer_linux
            KolocPlayer_windows.exe
